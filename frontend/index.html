<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha E-commerce Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <div class="logo">🛒 My Store</div>
    <div class="nav-links">
      <a href="#" onclick="showSection('products')">Home</a>
      <a href="#" onclick="showSection('cart')">Cart (<span id="cart-count">0</span>)</a>
      <a href="#" onclick="showSection('login')" id="auth-link">Login / Register</a>
      <a href="#" onclick="showSection('profile')" id="profile-link" style="display:none;">Profile</a>
      <a href="#" onclick="logout()" id="logout-btn" style="display:none;">Logout</a>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container">

    <!-- Products Section -->
    <section id="products-section">
      <h2>Our Premium Products</h2>
      <div class="products-grid" id="product-list">
        <!-- Products ఇక్కడ లోడ్ అవుతాయి -->
      </div>
    </section>

    <!-- Cart Section -->
    <section id="cart-section" style="display:none;">
      <h2>Your Shopping Cart</h2>
      <div id="cart-items"></div>
      <div id="cart-total" class="cart-total"></div>
      <button class="btn" onclick="placeOrder()" id="checkout-btn">Proceed to Checkout</button>
    </section>
     <!-- Profile Section -->
    <section id="profile-section" style="display:none;">
  <h2>My Profile</h2>
  <div class="profile-card" id="profile-card">
    <!-- Profile Details ఇక్కడ లోడ్ అవుతాయి -->
       </div>
      </section>
    <!-- Login Section -->
    <section id="login-section" style="display:none;">
      <div class="form-container">
        <h2 id="form-title">Login</h2>
        <input type="text" id="name" placeholder="Full Name" style="display:none;">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button class="btn" id="submit-btn" onclick="handleAuth()">Login</button>
        <p class="toggle-form" onclick="toggleAuthMode()" id="toggle-text">Don't have an account? Register</p>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
